name: AI CI/CD Pipeline

on: workflow_dispatch

env:
  IMAGE_NAME: fastapi-app
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html || true

      - name: Run Tests
        run: |
          pytest \
          --junitxml=report.xml \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --html=report.html \
          --self-contained-html \
          --cov-fail-under=80

      - name: Extract Coverage %
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          coverage = float(root.attrib.get("line-rate", 0)) * 100
          with open("status.json", "w") as f:
              json.dump({
                  "tests": "passed",
                  "coverage": round(coverage, 2),
                  "lint": "unknown",
                  "security": "unknown",
                  "dependency": "unknown"
              }, f)
          EOF

      - name: Upload Test Reports + Status
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.xml
            report.html
            coverage.xml
            htmlcov/
            status.json

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: pip install flake8 flake8-html

      - name: Run Lint
        run: |
          flake8 . --format=html --htmldir=flake8-report || true
          ERRORS=$(flake8 . --count --max-line-length=120 2>/dev/null | tail -n 1)

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)
          try:
              errors = int("$ERRORS".strip())
          except:
              errors = 1
          status["lint"] = "warning" if errors > 0 else "passed"
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            flake8-report
            status.json

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lint-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f html -o bandit-report.html || true

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)
          data = json.load(open("bandit-report.json"))
          issues = data.get("results", [])
          status["security"] = "passed" if len(issues) == 0 else "warning"
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.*
            status.json

  dependency-scan:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: security-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies + pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run Dependency Scan
        run: |

          pip-audit -r requirements.txt -f json -o dependency-report.json || true

          python <<EOF
          import json

          with open("dependency-report.json") as f:
              data = json.load(f)

          html = """
          <html>
          <head>
              <title>Dependency Report</title>

              <style>
                  body{
                      font-family:Arial;
                      background:#111827;
                      color:white;
                      padding:30px;
                  }

                  h1{
                      color:#f59e0b;
                  }

                  .card{
                      background:#1f2937;
                      padding:20px;
                      margin-bottom:20px;
                      border-radius:12px;
                  }

                  .vuln{
                      color:#ef4444;
                  }

                  .safe{
                      color:#22c55e;
                  }
              </style>
          </head>

          <body>

              <h1>📦 Dependency Vulnerability Report</h1>
          """

          vulns = 0

          for dep in data.get("dependencies", []):

              package = dep.get("name")
              version = dep.get("version")
              issues = dep.get("vulns", [])

              html += f"<div class='card'>"
              html += f"<h2>{package} ({version})</h2>"

              if not issues:
                  html += "<p class='safe'>✔ No vulnerabilities</p>"

              else:

                  vulns += len(issues)

                  for v in issues:
                      html += f"""
                      <div class='vuln'>
                          <p><b>ID:</b> {v.get("id")}</p>
                          <p><b>Fix Versions:</b> {v.get("fix_versions")}</p>
                      </div>
                      <hr>
                      """

              html += "</div>"

          html += "</body></html>"

          with open("dependency-report.html", "w") as f:
              f.write(html)

          # STATUS UPDATE

          with open("status.json") as f:
              status = json.load(f)

          status["dependency"] = "passed" if vulns == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)

          EOF

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-report.json
            status.json
            dependency-report.html

  
  ai-analysis:
    runs-on: ubuntu-latest
    needs: dependency-scan
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Download Dependency Report
        uses: actions/download-artifact@v4
        with:
          name: dependency-report

      - name: Prepare AI Input
        run: cat status.json > ai-input.txt

      - name: Generate AI Insights with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is missing"
            exit 1
          fi

          REPORT="$(cat ai-input.txt)"

          jq -n --arg report "$REPORT" \
            '{
              contents: [{
                role: "user",
                parts: [{
                  text: ("You are a senior DevOps engineer and CI/CD specialist.

          Analyze these pipeline results:
          " + $report + "

          Provide:
          1. Pipeline health summary
          2. Test coverage analysis
          3. Code quality observations
          4. Security recommendations
          5. Dependency vulnerability recommendations
          6. Actionable DevOps improvements

          Keep the report professional and beginner-friendly.")
                }]
              }],
              generationConfig: {
                temperature: 0.3
              }
            }' > gemini-request.json

          MODELS="gemini-3.5-flash gemini-3.5-flash-lite gemini-3.8-flash"
          SUCCESS=0

          for MODEL in $MODELS; do
            for ATTEMPT in 1 2 3 4; do
              HTTP_CODE=$(curl --silent --show-error \
                --output gemini-response.json \
                --write-out "%{http_code}" \
                "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent" \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -d @gemini-request.json || true)

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Gemini responded successfully using ${MODEL}"
                SUCCESS=1
                break 2
              fi

              echo "::warning::${MODEL} attempt ${ATTEMPT} returned HTTP ${HTTP_CODE}"

              case "$HTTP_CODE" in
                000|429|500|502|503|504)
                  sleep $((ATTEMPT * 15))
                  ;;
                *)
                  break
                  ;;
              esac
            done
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::All Gemini models failed. Last response:"
            cat gemini-response.json || true
            exit 1
          fi

      - name: Extract Gemini AI Summary
        run: |
          python <<'PY'
          import json
          import sys

          with open("gemini-response.json") as f:
              data = json.load(f)

          candidates = data.get("candidates", [])

          parts = (
              candidates[0].get("content", {}).get("parts", [])
              if candidates else []
          )

          result = "\n".join(
              part.get("text", "")
              for part in parts
              if part.get("text")
          )

          if not result:
              print(json.dumps(data, indent=2), file=sys.stderr)
              raise SystemExit("Gemini returned no text response")

          with open("ai-report.txt", "w") as f:
              f.write(result)

          print(result)
          PY

      - name: Show AI Summary in GitHub Actions
        run: |
          echo "## 🤖 Gemini AI DevOps Insights" >> $GITHUB_STEP_SUMMARY
          cat ai-report.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload AI Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: ai-report.txt

  deploy-report:
    runs-on: ubuntu-latest
    needs: ai-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Prepare Site
        run: |
          mkdir -p site
          cp reports/index.html site/index.html
          touch site/.nojekyll

          mkdir -p site/test-report
          mkdir -p site/lint-report
          mkdir -p site/security-report
          mkdir -p site/dependency-report
          mkdir -p site/ai-report

          cp -r test-report/* site/test-report/ || true
          cp -r lint-report/* site/lint-report/ || true
          cp -r security-report/* site/security-report/ || true
          cp -r dependency-report/* site/dependency-report/ || true
          cp -r ai-report/* site/ai-report/ || true

          cp dependency-report/status.json site/status.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          publish_dir: ./site
          force_orphan: true
